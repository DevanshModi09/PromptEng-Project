# CampusCrew – dropped into /etc/nginx/conf.d/
# This adds a NEW server block and does NOT touch your existing nginx.conf,
# SSL certificates, or any other site already configured on this machine.
#
# If you already have a server block on port 80 for your domain, do ONE of:
#   (a) Set server_name to a subdomain, e.g. crew.yourdomain.com  (recommended)
#   (b) Add a location block inside your existing server block instead:
#       location /campuscrew { alias /var/www/campuscrew; try_files $uri /index.html; }

server {
    listen 80;
    server_name _;   # change to e.g. crew.yourdomain.com if you have a domain

    root /var/www/campuscrew;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/html text/css application/javascript;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
