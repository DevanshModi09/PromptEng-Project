# CampusCrew nginx config
# Dropped into /etc/nginx/conf.d/ — does NOT touch your existing SSL or other server blocks.
#
# If you already have a catch-all server block on port 80, change server_name below
# to a subdomain e.g. crew.yourdomain.com

server {
    listen 80;
    server_name _;

    root /var/www/campuscrew;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/html text/css application/javascript;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
